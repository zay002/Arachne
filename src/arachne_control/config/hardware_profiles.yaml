profiles:
  sim:
    description: "Local RViz/Gazebo development without physical devices."
    base:
      mode: simulated
      command_topic: /cmd_vel
      odom_topic: /odom
    arm:
      mode: mock_ros2_control
      controller: aubo_arm_controller
    gripper:
      mode: simulated
      command_topic: /arachne/gripper/command

  mock:
    description: "No hardware attached, but real ROS contracts are exercised."
    base:
      mode: mock
      command_topic: /cmd_vel
      odom_topic: /odom
    arm:
      mode: mock
      trajectory_topic: /joint_trajectory_controller/joint_trajectory
    gripper:
      mode: mock
      command_topic: /arachne/gripper/command

  real:
    description: "Physical Scout 2.0, Aubo i5, and MS42DC."
    base:
      mode: official_ros
      package: scout_base
      can_interface: can0
      bitrate: 500000
      command_topic: /cmd_vel
      odom_topic: /odom
    arm:
      mode: official_ros
      package: aubo_ros2_driver
      robot_ip: 192.168.127.128
      controller: joint_trajectory_controller
    gripper:
      mode: vendor_ros
      package: step_motor
      serial_port: /dev/motor_serial
      command_topic: /arachne/gripper/command
      vendor_topic: motor_control
