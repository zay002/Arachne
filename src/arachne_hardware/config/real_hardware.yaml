arachne_real_hardware:
  ros_contract:
    safety_state: /arachne/safety/state
    gated_base_command: /arachne/cmd_vel_raw -> /cmd_vel
    base_command: /cmd_vel
    base_odom: /odom
    arm_controller: /joint_trajectory_controller/follow_joint_trajectory
    gripper_command: /arachne/gripper/command
    joint_states: /joint_states
  scout_2:
    default_driver: scout_waveshare_serial_driver
    official_package: scout_base
    upstream: https://github.com/agilexrobotics/scout_ros2
    dependency: https://github.com/agilexrobotics/ugv_sdk
    interface: waveshare_usb_can_a_serial
    usb_serial_chip: CH340
    port_name: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
    fallback_interface: socketcan
    fallback_port_name: can0
    bitrate: 500000
    usb_baudrate: 2000000
    frame_type: standard
    launch: ros2 launch arachne_hardware real_bringup.launch.py scout_driver:=waveshare
  ms42dc:
    vendor_package: step_motor
    source: third_party/MS42DC.../5.ROS例程与教程/源码/ROS2.zip
    default_driver: ms42dc_direct_serial_driver
    fallback_driver: step_motor + ms42dc_official_bridge
    serial_node: ros2 run step_motor motor_node
    serial_port_parameter: usart_port_name
    usb_serial_chip: CH91xx/CH343 family
    default_port: /dev/motor_serial
    command_topic: motor_control
    state_topic: motor_state
    arachne_command_topic: /arachne/gripper/command
    default_test_angle_tenths: 300
    default_test_speed_tenths: 150
    full_stroke_angle_tenths: 18720
  aubo_i5:
    official_package: aubo_ros2_driver
    upstream: https://github.com/AuboRobot/aubo_ros2_driver
    transport: tcp_ip
    robot_ip: 192.168.127.128
    default_type: aubo_i5
    controller_mac_hint: CC:82:7F:A3:E6:2E
    launch: AUBO_TYPE=aubo_i5 ./scripts/real_aubo_bringup.sh
  acceptance_test:
    script: ./scripts/real_hardware_acceptance_test.sh
    confirm_env: ARACHNE_CONFIRM_REAL_MOTION=YES
    sequence:
      - scout_forward_0.2m
      - scout_backward_0.2m
      - scout_left_30deg_return
      - scout_right_30deg_return
      - aubo_tool0_z_up_0.2m_return
      - ms42dc_open_close_5_cycles
