default:
  description: "Scout 2.0 + Aubo i5 with the Yizhua Robot MS42DC two-finger flexible servo gripper."
  xacro_args:
    arm_mount_xyz: "0.22 0.0 0.155"
    arm_mount_rpy: "0.0 0.0 1.57079632679"
    tool_adapter_xyz: "0.0 0.0 0.0"
    tool_adapter_rpy: "0.0 0.0 0.0"
    gripper_type: "ms42dc"
    with_lidar: "true"
    with_ee_camera: "false"
ag95:
  description: "Same Scout 2.0 + Aubo i5 model, with only the gripper changed to DH Robotics AG95."
  xacro_args:
    gripper_type: "ag95"
display_with_ee_camera:
  description: "Default model plus an end-effector camera placeholder."
  xacro_args:
    with_ee_camera: "true"
